name: Render Viral Short

on:
  workflow_dispatch:
    inputs:
      voiceover_text:
        description: 'Arabic voiceover text'
        required: true
      clip_urls:
        description: 'JSON array of stock video URLs (Pexels)'
        required: true
      voice:
        description: 'edge-tts voice'
        required: false
        default: 'ar-EG-SalmaNeural'
      rate:
        description: 'edge-tts rate'
        required: false
        default: '+0%'
      pitch:
        description: 'edge-tts pitch'
        required: false
        default: '+0Hz'
      episode_tag:
        description: 'Unique release tag'
        required: true
      resumeUrl:
        description: 'n8n resume URL (added automatically by n8n)'
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq fonts-noto-core
          pip install edge-tts

      - name: Generate voiceover and subtitles
        env:
          TEXT: ${{ inputs.voiceover_text }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          PITCH: ${{ inputs.pitch }}
        run: |
          printf '%s' "$TEXT" > script.txt
          edge-tts --voice "$VOICE" --rate="$RATE" --pitch="$PITCH" --file script.txt --write-media voice.mp3 --write-subtitles subs.srt
          ls -la voice.mp3 subs.*

      - name: Download stock clips
        env:
          CLIPS: ${{ inputs.clip_urls }}
        run: |
          i=0
          echo "$CLIPS" | jq -r '.[]' | while IFS= read -r u; do
            i=$((i+1))
            curl -sfL --max-time 180 -o "$(printf 'clip_%02d.mp4' "$i")" "$u" || echo "skip $u"
          done
          ls -la clip_*.mp4

      - name: Render vertical video with yellow subtitles
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice.mp3)
          N=$(ls clip_*.mp4 | wc -l)
          SEG=$(python3 -c "print(max(2.0, $DUR/$N + 0.2))")
          n=0
          for f in clip_*.mp4; do
            n=$((n+1))
            ffmpeg -y -stream_loop -1 -i "$f" -t "$SEG" -an \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p" \
              -c:v libx264 -preset veryfast -crf 23 "seg_$n.mp4" || continue
            echo "file 'seg_$n.mp4'" >> list.txt
          done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy joined.mp4
          SUBS=subs.srt; [ -f subs.srt ] || SUBS=$(ls subs.* | head -1)
          ffmpeg -y -i joined.mp4 -i voice.mp3 \
            -vf "subtitles=$SUBS:force_style='FontName=Noto Sans Arabic,FontSize=16,Bold=1,PrimaryColour=&H0000FFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=5,MarginV=0'" \
            -map 0:v -map 1:a -c:v libx264 -preset veryfast -crf 21 -c:a aac -b:a 192k -shortest -movflags +faststart episode.mp4
          ls -la episode.mp4

      - name: Publish video and notify n8n
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.episode_tag }}
          RESUME: ${{ inputs.resumeUrl }}
        run: |
          gh release create "$TAG" episode.mp4 --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Rendered short"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/episode.mp4"
          curl -sf -X POST -H 'Content-Type: application/json' -d "$(jq -n --arg u "$URL" '{status:"success",videoUrl:$u}')" "$RESUME"

      - name: Notify n8n of failure
        if: failure()
        env:
          RESUME: ${{ inputs.resumeUrl }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' -d "$(jq -n --arg r "$RUN_URL" '{status:"failure",runUrl:$r}')" "$RESUME"
